database:
  file: tower-defense.db

combat:
  radius: 80
  spawn-inner: 56
  spawn-outer: 80
  minimum-core-distance: 192
  core-gap: 32
  max-participants: 8
  countdown-seconds: 10
  preparation-seconds: 10
  intermission-seconds: 8
  absence-grace-seconds: 5

core:
  max-health: 1000
  damage-per-enemy: 20
  # Each enemy at the core deals this damage once per this many server ticks.
  attack-interval-ticks: 20
  # Idle repairs consume this vanilla material and the plugin-owned defense shards.
  repair-material: IRON_INGOT
  repair-health-per-unit: 100
  repair-material-base-cost: 1
  repair-shard-base-cost: 1
  repair-cost-per-clear-level: 1
  # Played only when a live defense core loses HP. This is not a global broadcast.
  warning-sound: ENTITY_ZOMBIE_ATTACK_WOODEN_DOOR
  warning-volume: 1.0
  warning-pitch: 1.0
  warning-min-interval-ticks: 10

enemies:
  max-alive: 120
  spawn-per-tick: 8
  base-per-wave: 4
  added-per-wave: 2
  boss-health-multiplier: 4.0
  move-speed: 1.0
  # Baseline role ratios; bounded stage/wave progression increases these up to 3x.
  destroyer-ratio: 0.15
  builder-ratio: 0.10
  speedster-ratio: 0.10
  ranged-ratio: 0.10
  heavy-ratio: 0.05
  # Destroyers damage nearby installed towers; HP 0 removes the tower without an item drop.
  tower-attack-damage: 8
  tower-attack-interval-ticks: 20
  tower-attack-range: 2.5

protection:
  # Case-insensitive world names in which cores and combat areas cannot be placed.
  forbidden-worlds: []
  # Horizontal inclusive rectangles. A rectangle intersecting the full combat circle is rejected.
  forbidden-regions: []

rewards:
  # TEAM rows are available to registered participants for this long before the current owner
  # may receive the pending row as a safe fallback.
  team-queue-retention-seconds: 604800
  # Successful stage clears issue one team-bound crystal batch through the reward queue.
  research-crystal-base-per-stage: 100
  research-crystal-replay-percent: 25
  research-crystal-minimum-quantity: 0
  # Event currency is team-shared and exists only until the event terminal transaction.
  battle-funds-normal-enemy: 5
  battle-funds-special-enemy: 15
  battle-funds-boss-enemy: 50
  battle-funds-per-wave: 50
  # Physical materials are escrowed until the event reaches a normal terminal state.
  defense-shards-normal-enemy: 1
  defense-shards-special-enemy: 2
  enhancement-core-drop-percent: 10
  # Keep physical-material payments available while old queued assets migrate safely.
  legacy-resource-payments-enabled: true

wave-mutations:
  # The three choices are snapshotted when an event starts; changing this section does not
  # change an event that is already running.
  enabled: true
  swift:
    enemy-speed-multiplier: 1.25
    enemy-health-multiplier: 1.0
    enemy-count-multiplier: 1.0
    reward-multiplier: 1.20
  fortified:
    enemy-speed-multiplier: 1.0
    enemy-health-multiplier: 1.35
    enemy-count-multiplier: 1.0
    reward-multiplier: 1.35
  reinforcements:
    enemy-speed-multiplier: 1.0
    enemy-health-multiplier: 1.0
    enemy-count-multiplier: 1.30
    reward-multiplier: 1.25

towers:
  # The cap is base + increment * highest-cleared-level, bounded by hard-cap.
  base-limit: 8
  limit-increment: 2
  hard-cap: 40
  max-health: 100
  arrow:
    damage: 4
    range: 16.0
    attack-interval-ticks: 20
  # Provisional second type: slow, high-damage area attack around the selected target.
  cannon:
    damage: 8
    range: 14.0
    attack-interval-ticks: 40
    splash-radius: 2.5
  frost:
    damage: 2
    range: 12.0
    attack-interval-ticks: 30
    slow-percent: 0.35
    slow-duration-ticks: 50
  lightning:
    damage: 6
    range: 18.0
    attack-interval-ticks: 35
    chain-count: 3
    chain-radius: 5.0
  support:
    damage: 1
    range: 10.0
    attack-interval-ticks: 40
    support-radius: 8.0
    support-damage-multiplier: 1.25
    support-speed-multiplier: 0.80
    support-range-multiplier: 1.15
    support-stack-limit: 2
  sniper:
    damage: 18
    range: 32.0
    attack-interval-ticks: 60
  flame:
    damage: 3
    range: 15.0
    attack-interval-ticks: 25
    area-radius: 3.0
    burn-duration-ticks: 80
  battle-boost:
    base-cost: 25
    cost-per-level: 15
    power-multiplier: 1.20
    speed-multiplier: 0.85
    range-multiplier: 1.15
    stack-limit: 3
    funds-per-health: 1
    health-per-purchase: 10
  upgrade:
    base-shard-cost: 2
    base-core-cost: 1
    shard-cost-per-level: 1
    core-cost-per-level: 1
    research-base-cost: 10
    research-cost-per-level: 5

# Enemy terrain mutation is fail-closed. Set each flag only after the reviewed Paper integration
# and recovery procedure has produced evidence for this server profile.
terrain-mutation:
  requested: false
  paper-integration-verified: false
  recovery-verified: false
